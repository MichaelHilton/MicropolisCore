name: MicropolisMacUITests
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
targets:
  MicropolisUITestHost:
    type: application
    platform: macOS
    sources:
      - path: UITestHost
    info:
      path: UITestHost/Info.plist
      properties:
        CFBundleIdentifier: org.micropolis.MicropolisUITestHost
        CFBundleName: Micropolis
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.micropolis.MicropolisUITestHost
    postBuildScripts:
      - name: Install SwiftPM application
        path: scripts/build-ui-test-host.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
  MicropolisMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/MicropolisMacUITests
    dependencies:
      - target: MicropolisUITestHost
    info:
      path: Tests/MicropolisMacUITests/Info.plist
      properties:
        CFBundleIdentifier: org.micropolis.MicropolisMacUITests
        CFBundlePackageType: BNDL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.micropolis.MicropolisMacUITests
        TEST_TARGET_NAME: MicropolisUITestHost
schemes:
  MicropolisUITests:
    build:
      targets:
        MicropolisUITestHost: all
        MicropolisMacUITests: [test]
    test:
      targets:
        - MicropolisMacUITests
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
